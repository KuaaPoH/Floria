<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Floria">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/logo.png"/>

  <title>Floria</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #F5F7F3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .bg-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
    }
    .orb-1 {
      width: 350px;
      height: 350px;
      top: -150px;
      right: -150px;
      background-color: rgba(46, 111, 64, 0.07);
    }
    .orb-2 {
      width: 320px;
      height: 320px;
      bottom: -120px;
      left: -120px;
      background-color: rgba(46, 111, 64, 0.08);
    }
    .loading-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .logo-ring {
      box-sizing: border-box;
      width: 116px;
      height: 116px;
      flex-shrink: 0;
      border-radius: 50%;
      background-color: #FFFFFF;
      border: 1.5px solid #E0EAE1;
      box-shadow: 0 8px 24px rgba(23, 35, 26, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .logo-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <div class="loading-container" id="loading-indicator">
    <div class="logo-ring">
      <img src="icons/logo.png" alt="Floria Logo">
    </div>
  </div>
  
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-indicator');
      if (loader) loader.remove();
      var bg = document.querySelector('.bg-decor');
      if (bg) bg.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
