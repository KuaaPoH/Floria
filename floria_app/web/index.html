<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Floria">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/logo.png"/>

  <title>Floria</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #F5F7F3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .bg-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
    }
    .orb-1 {
      width: 350px;
      height: 350px;
      top: -150px;
      right: -150px;
      background-color: rgba(46, 111, 64, 0.07);
    }
    .orb-2 {
      width: 320px;
      height: 320px;
      bottom: -120px;
      left: -120px;
      background-color: rgba(46, 111, 64, 0.08);
    }
    .loading-container {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 36px;
      pointer-events: none;
      transition: opacity 0.22s ease-out;
    }
    .loading-container.fade-out {
      opacity: 0;
    }
    .bg-decor {
      transition: opacity 0.22s ease-out;
    }
    .bg-decor.fade-out {
      opacity: 0;
    }
    .init-dots {
      display: flex;
      align-items: center;
      gap: 7px;
      opacity: 0.65;
    }
    .init-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #2E6F40;
      animation: dotPulse 1.1s infinite ease-in-out both;
    }
    .init-dot:nth-child(1) { animation-delay: -0.32s; }
    .init-dot:nth-child(2) { animation-delay: -0.16s; }
    .init-dot:nth-child(3) { animation-delay: 0s; }
    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.65); opacity: 0.35; }
      40% { transform: scale(1.0); opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <div class="loading-container" id="loading-indicator" aria-hidden="true">
    <div class="init-dots">
      <span class="init-dot"></span>
      <span class="init-dot"></span>
      <span class="init-dot"></span>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-indicator');
      var bg = document.querySelector('.bg-decor');
      if (loader) loader.classList.add('fade-out');
      if (bg) bg.classList.add('fade-out');
      setTimeout(function () {
        if (loader) loader.remove();
        if (bg) bg.remove();
      }, 240);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
